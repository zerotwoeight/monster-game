<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Board FX Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0e1c;--surface:#151627;--border:#272a38;--text:#e9e9ed;--dim:#9397ab;--accent:#9184d9;--gold:#a97b40;}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#0d0e1c;}}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px;box-sizing:border-box;}
h1{font-family:Cinzel,serif;letter-spacing:.15em;font-size:20px;margin:8px 0 4px;text-align:center}
p.sub{color:var(--dim);font-size:13px;margin:0 0 16px;text-align:center}
.stage{position:relative;width:min(760px,100%);aspect-ratio:16/10;background:radial-gradient(circle at 50% 50%,#e8d5b0 0 28%,#1a1b2e 29%);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.tile{position:absolute;width:11%;aspect-ratio:3/4;transform:translate(-50%,-50%)}
.tile-inner{width:100%;height:100%;border-radius:10px;border:2px solid #3f424d;background:#1c1e2b;display:flex;align-items:center;justify-content:center;font-family:Cinzel,serif;font-size:11px;color:var(--dim);position:relative}
.tile-badge{position:absolute;top:-14%;left:50%;width:56%;aspect-ratio:3/4;margin-left:-28%;border-radius:6px;border:2px solid var(--o,#5ca8e0);background:linear-gradient(160deg,#7f92e8,#2a2f5a);display:none}
.tile.owned .tile-badge{display:block}
.tile.owned .tile-inner{border-color:var(--o)}
.die{position:absolute;left:50%;top:50%;width:96px;height:96px;transform:translate(-50%,-50%);border-radius:18px;border:2px solid var(--gold);background:linear-gradient(145deg,#2a1f4a,#1a1230);display:flex;align-items:center;justify-content:center;font:700 52px Cinzel,serif;color:var(--text);text-shadow:0 0 18px rgba(145,132,217,.9)}
.tok{position:absolute;width:22px;height:22px;border-radius:50%;background:#e05252;border:3px solid #fff;transform:translate(-50%,-50%);transition:left .18s,top .18s;z-index:5;box-shadow:0 0 10px #e05252}
.btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0}
button{font:600 13px Inter,sans-serif;padding:10px 16px;border-radius:10px;border:1px solid var(--accent);background:var(--surface);color:var(--text);cursor:pointer}
button:hover{background:#22243a}
button.sel{background:var(--accent);color:#0d0e1c}
</style></head><body>
<h1>Board Effects — Tier 1</h1>
<p class="sub">Click to preview: 3D dice, token moves with landing, claim fanfare.</p>
<div class="stage" id="stage"><div class="die" id="die">?</div><div class="tok" id="tok"></div></div>
<div class="btns">
  <button onclick="roll()">🎲 Roll</button>
  <button onclick="roll(true)">🎲 Roll doubles</button>
  <button onclick="claimDemo()">🏰 Claim a tile</button>
  <button onclick="moveDemo()">👣 Move token (pass Mana Well)</button>
  <button id="lv-full" class="sel" onclick="lv('full')">Full</button>
  <button id="lv-red" onclick="lv('reduced')">Reduced</button>
</div>
<script src="board-fx.js"></script>
<script>
const stage=document.getElementById('stage'),tiles=[];
const N=16,COLS=['#e0c07a','#6b6b7a','#7f92e8','#5fb3a4','#d98a5a','#3aaa5c'];
for(let i=0;i<N;i++){const a=i/N*Math.PI*2-Math.PI/2;const t=document.createElement('div');t.className='tile';
 t.style.left=(50+Math.cos(a)*40)+'%';t.style.top=(50+Math.sin(a)*38)+'%';
 t.innerHTML=`<div class="tile-badge"></div><div class="tile-inner">${i===0?'WELL':i}</div>`;stage.appendChild(t);tiles.push(t);}
let pos=0;const tok=document.getElementById('tok');
function place(){const r=tiles[pos];tok.style.left=r.style.left;tok.style.top=r.style.top;}place();
function lv(v){BoardFX.setLevel(v);document.getElementById('lv-full').classList.toggle('sel',v==='full');document.getElementById('lv-red').classList.toggle('sel',v==='reduced');}
try{lv(BoardFX.level)}catch(e){}
function roll(dbl){const a=1+Math.floor(Math.random()*6),b=dbl?a:1+Math.floor(Math.random()*6);const die=document.getElementById('die');die.textContent='';
 BoardFX.rollDice(die,[a,b],a+b,{color:'#e05252'}).then(()=>{die.textContent=a+b;die.animate([{transform:'translate(-50%,-50%) scale(1.4)'},{transform:'translate(-50%,-50%) scale(1)'}],{duration:400,easing:'cubic-bezier(.3,1.6,.5,1)'});});}
function claimDemo(){const free=tiles.filter((t,i)=>i&&!t.classList.contains('owned'));if(!free.length){tiles.forEach(t=>t.classList.remove('owned'));return claimDemo();}
 const t=free[Math.floor(Math.random()*free.length)];const o=['#5ca8e0','#e05252','#5dc97d','#e0b050'][Math.floor(Math.random()*4)];
 t.style.setProperty('--o',o);t.classList.add('owned');BoardFX.claim(t.querySelector('.tile-inner'),{owner:o,elem:COLS[Math.floor(Math.random()*6)],name:'Alex',badge:t.querySelector('.tile-badge')});}
function moveDemo(){let steps=5;pos=(pos+N-3)%N;place();const go=()=>{pos=(pos+1)%N;place();setTimeout(()=>BoardFX.hop(tiles[pos].querySelector('.tile-inner'),{final:steps===1,color:'#e05252',well:pos===0&&steps>1}),180);if(--steps>0)setTimeout(go,260);};setTimeout(go,300);}
</script></body></html>
