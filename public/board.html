<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Summon Board — Game View</title>
<meta name="viewport" content="width=1440">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root {
  --bg:#0d0e1c; --bg-deep:#10111e; --surface:#1c1e2b; --surface2:#1e2030;
  --border:#272a38; --border2:#3f424d;
  --text:#e9e9ed; --text-lo:#b2b6ca; --text-dim:#9397ab; --text-mute:#75798c;
  --accent:#9184d9; --accent-lit:#b5abfc; --accent-pale:#d2cefd;
  --gold:#a97b40; --gold-glow:#c9a05a;
  --parch-hi:#f5efe0; --parch-lo:#e8d5b0;
  --parch-ink:#1a1710; --parch-sub:#6b5a3a; --parch-dim:#9397ab; --parch-stamp:#7a6040;
  --violet-deep:#2a1f4a;
  --el-Light:#e0c07a; --el-Dark:#6b6b7a; --el-Arcane:#7f92e8;
  --el-Undead:#5fb3a4; --el-Beast:#d98a5a; --el-Nature:#3aaa5c;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;}

/* Scale wrapper */
#scale-root{width:1440px;height:900px;transform-origin:top left;position:absolute;top:0;left:0;display:flex;flex-direction:column;}

/* Connection chip */
#conn-chip{position:fixed;top:10px;right:10px;z-index:9999;font-size:11px;padding:4px 10px;border-radius:20px;font-weight:500;letter-spacing:.06em;transition:all .3s;}
#conn-chip.ok{background:rgba(79,145,83,.25);border:1px solid #4f9153;color:#7dd982;}
#conn-chip.err{background:rgba(180,60,60,.25);border:1px solid #b43c3c;color:#f08080;}
#conn-chip.wait{background:rgba(145,132,217,.2);border:1px solid #9184d9;color:#b5abfc;animation:pulse 1.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* Topbar */
.topbar{height:80px;flex-shrink:0;display:flex;align-items:center;padding:0 26px;border-bottom:1px solid var(--border);background:var(--bg-deep);position:relative;gap:16px;}
.logo{width:42px;height:42px;border:1px solid var(--border2);border-radius:8px;background:repeating-linear-gradient(45deg,rgba(145,132,217,.1) 0,rgba(145,132,217,.1) 3px,transparent 3px,transparent 10px),var(--surface);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.room-block{display:flex;flex-direction:column;gap:1px;}
.room-lbl{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-mute);font-family:'Cinzel',serif;}
.room-code{font-size:22px;font-weight:500;letter-spacing:.08em;}
.tb-center{position:absolute;left:50%;transform:translateX(-50%);text-align:center;}
.turn-lbl{font-size:9px;color:var(--text-mute);text-transform:uppercase;letter-spacing:.18em;font-family:'Cinzel',serif;}
.active-name{font-size:28px;font-weight:500;letter-spacing:-.01em;line-height:1.1;}
.phase-lbl{font-size:11px;color:var(--text-lo);margin-top:1px;}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:16px;}
.roll-block{display:flex;flex-direction:column;align-items:flex-end;gap:1px;}
.roll-lbl{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-mute);font-family:'Cinzel',serif;}
.roll-val{font-size:28px;font-weight:500;letter-spacing:.1em;font-variant-numeric:tabular-nums;font-family:'Cinzel',serif;}
.vdiv{width:1px;height:34px;background:var(--border2);}
.mute-btn{background:rgba(145,132,217,.12);border:1px solid rgba(145,132,217,.28);border-radius:7px;color:var(--text-lo);font-size:18px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .18s,border-color .18s;line-height:1;padding:0;}
.mute-btn:hover{background:rgba(145,132,217,.22);border-color:rgba(145,132,217,.5);}

/* Main */
.main{flex:1;display:flex;overflow:hidden;}

/* Board area */
.board-area{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.board-bg{position:absolute;inset:0;background-size:cover;background-position:center;}
.board-bg::after{content:'';position:absolute;inset:0;background:rgba(10,10,20,.18);}

/* Wheel */
.wheel{position:relative;width:720px;height:720px;flex-shrink:0;z-index:1;}

/* Board art overlay */
.board-art{position:absolute;width:620px;height:620px;top:50%;left:50%;transform:translate(-50%,-50%);background-size:contain;background-repeat:no-repeat;background-position:center;z-index:0;opacity:.92;}

/* Tiles */
.tile{position:absolute;width:70px;height:102px;border-radius:6px;top:50%;left:50%;margin-left:-35px;margin-top:-51px;will-change:transform;z-index:2;cursor:pointer;transition:filter 120ms;}
.tile:hover{filter:brightness(1.18);}
.tile.selected .tile-inner{box-shadow:0 0 0 2px var(--accent),0 0 22px rgba(145,132,217,.45);border-radius:6px;}
.tile.active-tile .tile-inner{box-shadow:0 0 0 2px var(--gold-glow),0 0 18px rgba(201,160,90,.4);border-radius:6px;}
.tile.bonus-tile .tile-inner{box-shadow:0 0 0 2px #fff6,0 0 14px rgba(255,255,255,.22);border-radius:6px;animation:bonus-pulse 2.4s ease-in-out infinite;}
@keyframes bonus-pulse{0%,100%{box-shadow:0 0 0 2px #fff5,0 0 10px rgba(255,255,255,.18);}50%{box-shadow:0 0 0 2px #fffc,0 0 22px rgba(255,255,255,.38);}}
.tile-synergy-badge{position:absolute;top:2px;right:2px;font-size:8px;line-height:1;opacity:.9;pointer-events:none;z-index:3;text-shadow:0 0 4px #000;}
.chip-mono-badge{display:inline-block;font-size:9px;margin-left:4px;opacity:.9;vertical-align:middle;}
.chip-mono-label{font-size:8px;letter-spacing:.03em;opacity:.8;margin-left:2px;}
.tile-inner{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px 3px 4px;position:relative;border-radius:6px;overflow:hidden;}
.tile-badge{position:absolute;top:62%;left:50%;transform:translateX(-50%);pointer-events:none;z-index:1;}
.tile-idx{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:10px;color:rgba(255,255,255,.85);line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;}
.tile-icon{font-size:17px;margin-top:2px;}
.tile-name{font-size:10px;font-weight:500;letter-spacing:.03em;text-transform:uppercase;text-align:center;line-height:1.2;margin-top:3px;}
.tile-summon-row{display:flex;align-items:center;justify-content:center;margin-top:4px;}
.tile-target{position:relative;width:32px;height:32px;flex-shrink:0;}
.tile-target svg{position:absolute;inset:0;}

/* Player token */
.player-token{position:absolute;width:36px;height:36px;border-radius:50%;background:rgba(13,14,28,.9);border:2.5px solid;box-shadow:0 0 12px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;top:50%;left:50%;margin-left:-18px;margin-top:-18px;pointer-events:none;z-index:10;}
/* Token hop: lands with a bounce pop */
@keyframes tokenHopIn{0%{opacity:.55;transform:var(--tok-pos) scale(1.15);}65%{opacity:1;transform:var(--tok-pos) scale(.94);}100%{transform:var(--tok-pos) scale(1);}}
.player-token.hopping{animation:tokenHopIn 190ms cubic-bezier(.34,1.56,.64,1);}

/* Tile body — wrapper, allows independent transform from tile's radial position */
.tile-body{width:100%;height:100%;position:relative;transform-origin:center;}
/* Tile being visited mid-hop: card springs up 80ms after the token, springy easing */
.tile.is-visiting{z-index:5!important;}
.tile.is-visiting .tile-body{animation:tilePop 320ms cubic-bezier(0.68,-0.55,0.27,1.55) 80ms both;}
@keyframes tilePop{from{transform:scale(1);}to{transform:scale(1.25);}}
/* Settled destination tile: static outward shift only (no animation — avoids re-firing on every render) */
.tile.is-settled{z-index:6!important;}
.tile.is-settled .tile-body{transform:translateY(-25px);}

/* Wheel center */
.wheel-center{position:absolute;width:490px;height:490px;top:50%;left:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;border-radius:50%;z-index:4;pointer-events:none;}
.center-idle{display:flex;flex-direction:column;align-items:center;gap:12px;}
.arcane-die{width:108px;height:108px;border-radius:20px;background:linear-gradient(145deg,#2a1f4a,#1a1230);border:2px solid var(--gold);box-shadow:0 0 30px rgba(145,132,217,.35);display:flex;align-items:center;justify-content:center;position:relative;}
.arcane-die.die-cycling{animation:boardDieCycle .09s ease-in-out;}
@keyframes boardDieCycle{0%{transform:scale(1.08) rotate(4deg)}50%{transform:scale(0.91) rotate(-4deg)}100%{transform:scale(1) rotate(0)}}
.arcane-die.die-landed{animation:boardDieLand .45s cubic-bezier(.36,.07,.19,.97);}
@keyframes boardDieLand{0%{transform:scale(1.45) rotate(-6deg)}35%{transform:scale(0.86) rotate(5deg)}65%{transform:scale(1.12) rotate(-2deg)}100%{transform:scale(1) rotate(0)}}
.board-die-flash{animation:boardFaceFlash .07s ease;}
@keyframes boardFaceFlash{0%{opacity:.15;transform:scale(0.65)}100%{opacity:1;transform:scale(1)}}
.die-face{font-size:62px;font-weight:700;color:var(--text);text-shadow:0 0 18px rgba(145,132,217,.9),0 0 36px rgba(145,132,217,.4);line-height:1;font-family:'Cinzel',serif;font-variant-numeric:tabular-nums;}
.die-pip{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 5px var(--gold-glow);}
.pip-tl{top:8px;left:8px}.pip-tr{top:8px;right:8px}.pip-bl{bottom:8px;left:8px}.pip-br{bottom:8px;right:8px}
.center-title{font-family:'Cinzel',serif;font-size:18px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;text-align:center;color:#3d1f0d;}
.center-sub{font-size:12px;color:#3d1f0d;text-align:center;margin-top:2px;}

/* Battle center overlay */
.battle-center{position:absolute;width:480px;height:480px;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(10,11,22,.95);border-radius:50%;border:2px solid #5d5294;box-shadow:0 0 40px rgba(93,82,148,.3);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:5;padding:40px;}
.battle-center.visible{display:flex;}
.battle-eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-pale);font-family:'Cinzel',serif;}
.battle-row{display:flex;align-items:center;gap:14px;}
.battle-nums{display:flex;flex-direction:column;align-items:center;gap:3px;}
.battle-dmg{font-size:28px;font-weight:500;color:var(--accent-lit);font-family:'Cinzel',serif;font-variant-numeric:tabular-nums;}
.battle-note{font-size:9px;color:var(--text-dim);}
.battle-foot{font-size:10px;color:var(--text-dim);text-align:center;}

/* ── Clash result animation ── */
@keyframes clashSlideL{from{transform:translateX(-28px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes clashSlideR{from{transform:translateX(28px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes clashProjR{0%{transform:translateX(0) scale(1.3);opacity:1}100%{transform:translateX(60px) scale(.4);opacity:0}}
@keyframes clashProjL{0%{transform:translateX(0) scale(1.3);opacity:1}100%{transform:translateX(-60px) scale(.4);opacity:0}}
@keyframes clashHit{0%,100%{transform:scale(1)}30%{transform:scale(1.07) rotate(-2deg)}65%{transform:scale(1.07) rotate(2deg)}}
@keyframes clashDmg{0%{opacity:0;transform:translateY(0) scale(.7)}15%{opacity:1;transform:translateY(-6px) scale(1.15)}75%{opacity:1;transform:translateY(-20px) scale(1)}100%{opacity:0;transform:translateY(-28px) scale(.85)}}
@keyframes clashOutcome{0%,52%{opacity:0;transform:scale(.65)}72%{transform:scale(1.1)}100%{opacity:1;transform:scale(1)}}
.clash-arena{display:flex;align-items:center;gap:8px;}
.clash-side{display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;}
.clash-side.left{animation:clashSlideL .7s ease both;}
.clash-side.right{animation:clashSlideR .7s ease both;}
.clash-eyebrow{font-size:9px;letter-spacing:.14em;text-transform:uppercase;font-family:'Cinzel',serif;}
.clash-mid{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:80px;}
.clash-proj{font-size:14px;font-weight:700;font-family:'Cinzel',serif;white-space:nowrap;}
.clash-proj.atk{animation:clashProjR .55s 1.0s ease both;color:#e87040;}
.clash-proj.def-proj{animation:clashProjL .55s 1.0s ease both;color:#6080e8;}
.clash-vs{font-size:16px;font-weight:900;color:var(--accent-lit);font-family:'Cinzel',serif;opacity:.55;}
.clash-outcome-label{font-size:14px;font-weight:700;font-family:'Cinzel',serif;text-align:center;line-height:1.2;animation:clashOutcome .6s 2.4s ease both;}
.clash-hit{animation:clashHit .5s 1.7s ease both;display:inline-block;}
.clash-dmg{position:absolute;top:28px;left:50%;transform:translateX(-50%);font-size:17px;font-weight:900;font-family:'Cinzel',serif;color:#e84040;animation:clashDmg 2.5s 1.7s ease both;pointer-events:none;text-shadow:0 0 10px #e8404088;white-space:nowrap;}
.clash-dmg.zero{color:#888;font-size:13px;}

/* Summon card (board battle view) */
.board-summon-card{width:130px;height:186px;border-radius:10px;position:relative;overflow:hidden;border:2px solid;flex-shrink:0;}
.bmc-art{position:absolute;top:0;left:0;width:100%;height:100%;}
.bmc-overlay{position:absolute;bottom:0;left:0;right:0;padding:6px 7px 7px;background:linear-gradient(to top,rgba(10,8,25,.97) 0%,rgba(10,8,25,.65) 55%,transparent 100%);}
.bmc-name{font-size:10px;font-weight:700;font-family:'Cinzel',serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bmc-hp-row{display:flex;align-items:center;gap:4px;margin:3px 0;}
.bmc-hp-track{flex:1;height:3px;background:rgba(255,255,255,.15);border-radius:2px;}
.bmc-hp-fill{height:100%;border-radius:2px;}
.bmc-hp-num{font-size:9px;color:#fff;font-variant-numeric:tabular-nums;}
.bmc-stats{display:flex;gap:6px;}
.bmc-stat{display:flex;flex-direction:column;align-items:center;}
.bmc-stat-lbl{font-size:7px;color:rgba(255,255,255,.4);letter-spacing:.06em;text-transform:uppercase;}
.bmc-stat-val{font-size:11px;font-weight:700;color:#e8e4f4;font-variant-numeric:tabular-nums;}
.bmc-special{position:absolute;top:5px;left:5px;font-size:7px;background:rgba(145,132,217,.35);border:1px solid rgba(145,132,217,.55);border-radius:10px;padding:2px 5px;color:#c5bfee;font-family:'Cinzel',serif;z-index:2;}

/* Right rail */
.right-rail{width:330px;flex-shrink:0;background:var(--bg-deep);border-left:1px solid var(--border);padding:14px 12px;display:flex;flex-direction:column;gap:10px;}

/* Paper */
.paper{position:relative;border:2px solid var(--gold);border-radius:9px;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.22),transparent 55%),linear-gradient(150deg,var(--parch-hi),var(--parch-lo));box-shadow:inset 0 0 32px rgba(103,69,30,.14);color:var(--parch-ink);overflow:hidden;padding:44px 18px 18px;display:flex;flex-direction:column;flex:1;min-height:0;}
.paper-corner{position:absolute;font-size:24px;color:var(--gold-glow);line-height:1;}
.corner-tl{top:8px;left:8px}.corner-tr{top:8px;right:8px}.corner-bl{bottom:8px;left:8px}.corner-br{bottom:8px;right:8px}
.paper-lbl{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--parch-sub);margin-bottom:7px;font-family:'Cinzel',serif;flex-shrink:0;}

/* Player chips */
.players-list{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;flex-shrink:0;}
.player-chip{display:flex;align-items:center;gap:8px;padding:7px 9px;background:rgba(255,255,255,.38);border:1px solid rgba(169,123,64,.28);border-radius:7px;}
.player-chip.active{background:rgba(255,255,255,.56);border-color:rgba(169,123,64,.6);}
.chip-dot{width:20px;height:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.chip-info{flex:1;min-width:0;}
.chip-name{font-size:13px;font-weight:600;color:var(--parch-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chip-sub{font-size:10px;color:var(--parch-dim);font-variant-numeric:tabular-nums;}
.chip-mana{display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0;}
.chip-mana-val{font-size:15px;font-weight:600;color:var(--parch-ink);font-variant-numeric:tabular-nums;}
.chip-mana-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--parch-sub);font-family:'Cinzel',serif;}

/* Paper scroll */
.paper-scroll{flex:1;overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:0;}
.paper-scroll::-webkit-scrollbar{width:4px;}
.paper-scroll::-webkit-scrollbar-thumb{background:rgba(169,123,64,.3);border-radius:2px;}

/* Event log */
.log-row{display:flex;gap:7px;padding:5px 0;border-bottom:1px solid rgba(103,69,30,.16);align-items:flex-start;}
.log-icon{font-size:11px;flex-shrink:0;padding-top:1px;}
.log-text{font-size:11px;color:#2a2015;line-height:1.4;}

/* Tile inspector panel */
.inspector-lbl{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--parch-sub);margin-bottom:4px;font-family:'Cinzel',serif;}
.inspector-box{background:rgba(255,255,255,.3);border:1px solid rgba(169,123,64,.3);border-radius:7px;padding:10px;}
.inspector-tile-num{font-size:10px;color:var(--parch-dim);margin-bottom:2px;}
.inspector-tile-name{font-size:16px;font-weight:600;margin-bottom:4px;}
.inspector-tile-desc{font-size:11px;color:var(--parch-sub);line-height:1.4;margin-bottom:8px;}
.inspector-summon-hdr{font-size:10px;color:var(--parch-sub);margin-bottom:4px;}
.inspector-back{font-size:11px;color:var(--parch-sub);background:none;border:none;cursor:pointer;padding:0 0 6px 0;font-family:'Inter',sans-serif;text-decoration:underline;}
.inspector-back:hover{color:var(--parch-ink);}
.mini-card-insp{width:100%;height:140px;border-radius:8px;overflow:hidden;position:relative;}

/* Lobby splash screen */
.lobby-splash{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;}
.lobby-brand{text-align:center;margin-bottom:36px;}
.lobby-brand-title{font-family:'Cinzel',serif;font-size:52px;font-weight:700;letter-spacing:.14em;color:var(--gold-glow);text-shadow:0 0 50px rgba(201,160,90,.45);}
.lobby-brand-sub{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--text-mute);margin-top:8px;font-family:'Cinzel',serif;}
.lobby-panels{display:flex;gap:18px;align-items:stretch;width:100%;max-width:960px;}
.lobby-panel{background:rgba(10,10,22,.86);border:1px solid rgba(169,123,64,.28);border-radius:14px;padding:26px 28px;backdrop-filter:blur(4px);}
.lobby-panel-title{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.32em;text-transform:uppercase;color:var(--text-mute);margin-bottom:18px;}
.lobby-code-box{background:rgba(169,123,64,.07);border:2px solid rgba(169,123,64,.38);border-radius:10px;padding:18px 24px;text-align:center;margin-bottom:18px;overflow:hidden;}
.lobby-code-value{font-family:'Cinzel',serif;font-size:46px;font-weight:700;letter-spacing:.16em;padding-right:.16em;color:var(--gold-glow);text-shadow:0 0 30px rgba(201,160,90,.5);line-height:1.1;display:block;text-align:center;}
.lobby-code-hint{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-mute);margin-top:6px;font-family:'Cinzel',serif;}
.lobby-url-lbl{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-mute);margin-bottom:6px;font-family:'Cinzel',serif;}
.lobby-url-box{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.09);border-radius:8px;padding:10px 14px;font-family:monospace;font-size:12px;color:var(--accent-lit);letter-spacing:.03em;word-break:break-all;line-height:1.5;}
.lobby-count-ring{display:flex;align-items:center;justify-content:center;flex-direction:column;padding:12px 0 4px;}
.lobby-count-num{font-family:'Cinzel',serif;font-size:40px;font-weight:700;color:var(--gold-glow);line-height:1;}
.lobby-count-sub{font-size:11px;color:var(--text-dim);margin-top:2px;}
.lobby-slot-grid{display:flex;flex-direction:column;gap:7px;}
.lobby-slot{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.03);transition:all .3s;}
.lobby-slot.filled{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14);}
.lobby-slot.empty{opacity:.38;}
.lobby-slot-name{font-size:14px;font-weight:500;flex:1;letter-spacing:.01em;}
.lobby-slot-set{font-size:10px;color:var(--text-dim);font-family:'Cinzel',serif;letter-spacing:.1em;flex-shrink:0;}
.lobby-slot-empty-text{font-size:11px;color:var(--text-mute);letter-spacing:.1em;font-family:'Cinzel',serif;}

<script>
'use strict';

// ─── Background image ────────────────────────────────────────────────────────────────────────────────
const BKG_SRC = "/images/bkg_1140.png";

// ─── SFX (Web Audio API — procedural, no external files) ─────────────────────────────────────────────
const SFX = (() => {
  let _ctx = null;
  function ctx() {
    if (!_ctx) _ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (_ctx.state === 'suspended') _ctx.resume().catch(()=>{});
    return _ctx;
  }
  document.addEventListener('click',   () => ctx(), {once:true, capture:true});
  document.addEventListener('keydown', () => ctx(), {once:true, capture:true});

  function tone(freq, type='sine', vol=0.15, dur=0.12, attack=0.005, rel=0.1, delay=0) {
    try {
      const c = ctx(), now = c.currentTime;
      const o = c.createOscillator(), g = c.createGain();
      o.connect(g); g.connect(c.destination);
      o.type = type; o.frequency.setValueAtTime(freq, now + delay);
      g.gain.setValueAtTime(0.001, now + delay);
      g.gain.linearRampToValueAtTime(vol, now + delay + attack);
      g.gain.exponentialRampToValueAtTime(0.001, now + delay + dur);
      o.start(now + delay); o.stop(now + delay + dur + 0.02);
    } catch(e){}
  }
  function noise(vol=0.08, dur=0.1, delay=0, hipass=0) {
    try {
      const c = ctx(), now = c.currentTime;
      const buf = c.createBuffer(1, Math.ceil(c.sampleRate * dur), c.sampleRate);
      const d = buf.getChannelData(0);
      for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
      const src = c.createBufferSource(); src.buffer = buf;
      const g = c.createGain();
      if (hipass) {
        const f = c.createBiquadFilter(); f.type='highpass'; f.frequency.value=hipass;
        src.connect(f); f.connect(g);
      } else { src.connect(g); }
      g.connect(c.destination);
      g.gain.setValueAtTime(vol, now + delay);
      g.gain.exponentialRampToValueAtTime(0.001, now + delay + dur);
      src.start(now + delay); src.stop(now + delay + dur + 0.02);
    } catch(e){}
  }

  return {
    unlock() { ctx(); },
    // Die cycling tick — wooden click
    dieTick() {
      noise(0.06, 0.035, 0, 800);
      tone(180, 'square', 0.035, 0.035, 0.001, 0.03);
    },
    // Die lands — weighted thud, scales with value
    dieLand(val=3) {
      noise(0.18, 0.18);
      tone(55 + val*10, 'sine', 0.28, 0.35, 0.002, 0.32);
      tone(110 + val*18, 'triangle', 0.12, 0.22, 0.002, 0.20);
    },
    // Token hop — soft footstep per tile
    tokenHop() {
      noise(0.04, 0.04, 0, 600);
      tone(320, 'sine', 0.065, 0.07, 0.002, 0.065);
    },
    // Token arrives at destination — ascending chime
    tokenArrive() {
      tone(660,  'sine', 0.14, 0.35, 0.005, 0.32);
      tone(880,  'sine', 0.09, 0.28, 0.004, 0.25, 0.05);
      tone(1100, 'sine', 0.055,0.22, 0.003, 0.20, 0.10);
    },
    // Battle engaged — low dramatic swell
    battleStart() {
      noise(0.14, 0.5);
      tone(65,  'sawtooth', 0.18, 0.55, 0.025, 0.50);
      tone(130, 'sawtooth', 0.09, 0.45, 0.020, 0.42, 0.12);
      tone(390, 'sine',     0.07, 0.35, 0.010, 0.32, 0.22);
    },
    // Attacker wins — triumphant ascending triad
    battleWin() {
      tone(440, 'sine', 0.20, 0.22, 0.005, 0.20);
      tone(554, 'sine', 0.17, 0.22, 0.005, 0.20, 0.20);
      tone(660, 'sine', 0.20, 0.40, 0.005, 0.36, 0.40);
      noise(0.06, 0.18, 0.35);
    },
    // Defender wins — descending defeat
    battleLose() {
      tone(330, 'sawtooth', 0.16, 0.22, 0.005, 0.20);
      tone(277, 'sawtooth', 0.14, 0.22, 0.005, 0.20, 0.22);
      tone(207, 'sine',     0.16, 0.50, 0.005, 0.46, 0.44);
      noise(0.08, 0.25, 0.40);
    },
    // Mutual destruction — crash + burst
    battleMutual() {
      noise(0.22, 0.45);
      tone(140, 'sawtooth', 0.18, 0.55, 0.001, 0.50);
      tone(200, 'square',   0.10, 0.42, 0.001, 0.38, 0.06);
    },
    // Stalemate — unresolved wobble
    battleStalemate() {
      tone(370, 'sine', 0.13, 0.18, 0.005, 0.15);
      tone(350, 'sine', 0.11, 0.18, 0.005, 0.15, 0.22);
      tone(370, 'sine', 0.09, 0.22, 0.005, 0.20, 0.44);
    },
    // Claim tile — place + chime
    claimTile() {
      noise(0.08, 0.12, 0, 200);
      tone(480, 'sine', 0.10, 0.18, 0.003, 0.15);
      tone(720, 'sine', 0.065,0.14, 0.002, 0.12, 0.10);
    },
  };
})();

// ─── Constants ────────────────────────────────────────────────────────────────────────────────
const TYPE_COLOR  = {Light:'#e0c07a',Dark:'#6b6b7a',Arcane:'#7f92e8',Undead:'#5fb3a4',Beast:'#d98a5a',Nature:'#3aaa5c'};
const TYPE_ICON   = {Light:'✦',Dark:'◉',Arcane:'✶',Undead:'☠',Beast:'⚔',Nature:'❧'};
const TYPE_STRONG = {Light:'Dark',Dark:'Arcane',Arcane:'Undead',Undead:'Beast',Beast:'Nature',Nature:'Light'};
const TYPE_WEAK   = {Light:'Nature',Dark:'Light',Arcane:'Dark',Undead:'Arcane',Beast:'Undead',Nature:'Beast'};
const SPECIAL_ICONS = {start:'✦',temple:'❖',chest:'❖',heal:'❖',healing:'❖',mana:'❖','mana well':'❖',well:'❖'};
const TILE_IMG = {
  Light:'/img/tiles/tile-light.png', Dark:'/img/tiles/tile-dark.png',
  Arcane:'/img/tiles/tile-arcane.png', Undead:'/img/tiles/tile-undead.png',
  Beast:'/img/tiles/tile-beast.png', Nature:'/img/tiles/tile-nature.png',
  chest:'/img/tiles/tile-chest.png', heal:'/img/tiles/tile-heal.png',
  healing:'/img/tiles/tile-heal.png', temple:'/img/tiles/tile-temple.png',
  start:'/img/tiles/tile-well.png', well:'/img/tiles/tile-well.png',
  mana:'/img/tiles/tile-well.png', 'mana well':'/img/tiles/tile-well.png'
};
const PHASE_LABELS = {
  lobby:'Lobby',setup:'Setup Phase',shop:'Shop Phase',roll:'Roll Phase',
  'resolve:claim':'Claim Tile',stalemate:'Stalemate',
  'resolve:battle':'Battle!','resolve:own':'Own Tile',
  'resolve:chest':'Chest Opened','resolve:temple':'Temple',
  'resolve:heal_tile':'Healing Tile',game_over:'Game Over',
  'resolve:wildcard_cards':'🃏 Wild Card',
  'resolve:wildcard_target':'🃏 Wild Card',
  'resolve:wildcard_coup_tile':'🃏 Coup — Pick Tile',
  'resolve:wildcard_coup_summon':'🃏 Coup — Deploy',
  'resolve:wildcard_shatter':'🃏 Shatter'
};

// ─── State ────────────────────────────────────────────────────────────────────────────────
let G = null;
let ws = null;
let boardPrevPhase = null;           // tracks phase to detect roll completion
let boardPrevCurrentPlayer = null;   // tracks player to avoid cross-turn false triggers
let boardRollAnimating = false;      // true while die cycles + holds
let boardPendingG = null;            // state received during animation
let boardShowIdleDie = false;        // forces idle die even in battle phase
let boardTokenAnim = null;           // {playerIdx, path:[tileIdxs], step} — hop-by-hop movement
let reconnectTimer = null;
let selectedTile = null;
let selectedRoundLimit = 20;
// Persist room code across WebSocket reconnects so we always rejoin the same room.
// Initialised from ?room=CODE in the URL; updated when we first receive a state with a code.
let savedRoomCode = new URLSearchParams(location.search).get('room') || '';
// Spectator mode — set when page loaded at /spectate
const isSpectator = window.location.pathname.includes('/spectate');
let spectatorJoined = false; // true once spectate_connect is acknowledged
// Tile element cache — keeps img/GIF elements alive across renders
// so token moves don't cause image flicker or GIF restarts
const tileElCache = new Map(); // tileIdx → { el: HTMLElement, contentKey: string }
let _uid = 0;

function artSVG(type,w,h){ const c=TYPE_COLOR[type]||'#9397ab'; const fn=SVG_FNS[type]; return fn?fn(c,w,h):''; }
function summonImg(id,suffix=''){
  const png=`/img/monsters/monster-${id}${suffix}.png`;
  return `<img src="/img/monsters/monster-${id}${suffix}.gif" style="width:100%;height:100%;object-fit:cover;display:block;" onerror="this.src='${png}';this.onerror=function(){this.style.display='none'}" alt="">`;

function renderBoardCard(m) {
  if (!m) return '';
  const isRare = m.rarity === 'rare';
  const c  = TYPE_COLOR[m.type]  || '#9184d9';
  const c2 = m.type2 ? (TYPE_COLOR[m.type2] || '#9184d9') : null;
  const pct = Math.max(0, Math.min(1, m.hp / m.maxHp));
  const hpColor = pct < .35 ? '#b05050' : c;
  let border, shadow;
  if (isRare) {
    border = c;
    shadow = `box-shadow:0 0 0 2px ${c}99,0 0 0 3.5px ${c2}66,0 0 22px ${c}44`;
  } else if (m.isSpecial) {
    border = `${c}cc`;
    shadow = `box-shadow:0 0 0 2.5px ${c}33,0 0 22px ${c}44`;
  } else {
    border = `${c}88`;
    shadow = `box-shadow:0 0 14px ${c}28`;
  }
  const art = m.id ? summonImg(m.id) : artSVG(m.type, 130, 186);
  const typeLabel = m.type2 ? `<span style="color:${c}">${m.type}</span><span style="color:rgba(255,255,255,.4)">/</span><span style="color:${c2}">${m.type2}</span>` : `<span style="color:${c}">${m.type}</span>`;
  return `<div class="board-summon-card" style="border-color:${border};${shadow}">
    ${m.isSpecial ? `<div class="bmc-special">✦ Ascendant</div>` : ''}
    ${isRare ? `<div class="bmc-special" style="color:#c8aaff;border-color:rgba(200,170,255,.45);background:rgba(145,132,217,.18);">★ Rare</div>` : ''}
    ${m.charm ? `<div style="position:absolute;top:4px;right:4px;width:14px;height:14px;border-radius:50%;background:#c9a05a;box-shadow:0 0 8px #c9a05acc;z-index:3;display:flex;align-items:center;justify-content:center;font-size:8px;line-height:1;" title="Battle Charm">⚡</div>` : ''}
    <div class="bmc-art">${art}</div>
    <div class="bmc-overlay">
      <div class="bmc-name" style="color:${c}">${m.name}</div>
      <div class="bmc-hp-row"><div class="bmc-hp-track"><div class="bmc-hp-fill" style="width:${Math.round(pct*100)}%;background:${hpColor}"></div></div><span class="bmc-hp-num">${m.hp}/${m.maxHp}</span></div>
      <div class="bmc-stats">
        <div class="bmc-stat"><span class="bmc-stat-lbl">ATK</span><span class="bmc-stat-val">${m.atk}</span></div>
        <div class="bmc-stat"><span class="bmc-stat-lbl">DEF</span><span class="bmc-stat-val">${m.def}</span></div>
        <div class="bmc-stat"><span class="bmc-stat-lbl">TYPE</span><span class="bmc-stat-val" style="font-size:7px;">${typeLabel}</span></div>
      </div>
    </div>
  </div>`;
}

// ─── Player sigil SVG ──────────────────────────────────────────────────────────────────────────
function playerSigilSVG(player, size=20){
  const c = player.color;
  const i = (player.idx !== undefined ? player.idx : 0) % 6;
  const s = size, h = s/2;
  // Distinct geometric shape per player slot
  if(i===0){
    // Circle (ring)
    return `<svg width="${s}" height="${s}" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5" fill="${c}33" stroke="${c}" stroke-width="2"/><circle cx="10" cy="10" r="3" fill="${c}" opacity=".85"/></svg>`;
  } else if(i===1){
    // Diamond
    return `<svg width="${s}" height="${s}" viewBox="0 0 20 20"><polygon points="10,2 18,10 10,18 2,10" fill="${c}44" stroke="${c}" stroke-width="1.8"/><polygon points="10,6 14,10 10,14 6,10" fill="${c}" opacity=".85"/></svg>`;
  } else if(i===2){
    // Triangle
    return `<svg width="${s}" height="${s}" viewBox="0 0 20 20"><polygon points="10,2 18.5,17.5 1.5,17.5" fill="${c}44" stroke="${c}" stroke-width="1.8"/><polygon points="10,7 15,16 5,16" fill="${c}" opacity=".85"/></svg>`;
  } else if(i===3){
    // Star
    return `<svg width="${s}" height="${s}" viewBox="0 0 20 20"><polygon points="10,1 12.5,7.5 19.5,7.5 14,12 16,18.5 10,14.5 4,18.5 6,12 0.5,7.5 7.5,7.5" fill="${c}55" stroke="${c}" stroke-width="1.2"/><polygon points="10,4.5 11.8,9.5 17,9.5 12.8,12.5 14.4,17.5 10,14.5 5.6,17.5 7.2,12.5 3,9.5 8.2,9.5" fill="${c}" opacity=".85"/></svg>`;
  } else if(i===4){
    // Pentagon
    const pts=(r,cy=10)=>Array.from({length:5},(_,j)=>{const a=j*72-90;return `${10+Math.cos(a*Math.PI/180)*r},${cy+Math.sin(a*Math.PI/180)*r}`;}).join(' ');
    return `<svg width="${s}" height="${s}" viewBox="0 0 20 20"><polygon points="${pts(8.5)}" fill="${c}44" stroke="${c}" stroke-width="1.8"/><polygon points="${pts(4.5)}" fill="${c}" opacity=".85"/></svg>`;
  } else {
    // Hexagon
    const pts=r=>Array.from({length:6},(_,j)=>{const a=j*60-30;return `${10+Math.cos(a*Math.PI/180)*r},${10+Math.sin(a*Math.PI/180)*r}`;}).join(' ');
    return `<svg width="${s}" height="${s}" viewBox="0 0 20 20"><polygon points="${pts(8.5)}" fill="${c}44" stroke="${c}" stroke-width="1.8"/><polygon points="${pts(4.5)}" fill="${c}" opacity=".85"/></svg>`;
  }
}

// ─── Tile mini summon card ─────────────────────────────────────────────────────────────────────
function tileSummonCard(summon, ownerColor){
  const c = TYPE_COLOR[summon.type] || '#9397ab';
  const pct = Math.max(0, Math.min(1, summon.hp / summon.maxHp));
  const hpColor = pct < 0.35 ? '#c05050' : pct < 0.6 ? '#c09040' : c;
  // Art: SVG base + try real summon image on top
  const svgArt = artSVG(summon.type, 54, 70);
  const imgLayer = summon.id
    ? `<img src="/img/monsters/monster-${summon.id}-mini.gif" class="tmc-art-img-overlay" onerror="this.src='/img/monsters/monster-${summon.id}-mini.png';this.onerror=function(){this.remove()}" alt="">`
    : '';
  return `<div class="tmc-wrap">
    <div class="tmc-card" style="border-color:${ownerColor};">
      <div class="tmc-art">${svgArt}${imgLayer}</div>
      <div class="tmc-strip" style="background:${c};"></div>
    </div>
    <div class="tmc-hp-wrap">
      <div class="tmc-hp-bar"><div class="tmc-hp-fill" style="width:${Math.round(pct*100)}%;background:${hpColor};"></div></div>
      <div class="tmc-hp-num" style="color:rgba(255,255,255,.9);">${summon.hp}/${summon.maxHp}</div>
    </div>
  </div>`;
}

// ─── Token hop animation ─────────────────────────────────────────────────────────────────
function getEffectivePosition(playerIdx) {
  if (boardTokenAnim && boardTokenAnim.playerIdx === playerIdx) {
    return boardTokenAnim.path[boardTokenAnim.step];
  }
  return G.players[playerIdx]?.position;
}

// Build a path array [fromPos, fromPos+1, ..., toPos] wrapping at 28
function buildHopPath(fromPos, toPos) {
  const N = 28;
  const path = [fromPos];
  let p = fromPos;
  while (p !== toPos) {
    p = (p + 1) % N;
    path.push(p);
  }
  return path;
}

// Advance boardTokenAnim one step; call this every 230ms after the die lands
function advanceTokenAnim() {
  if (!boardTokenAnim) return;
  boardTokenAnim.step++;
  if (boardTokenAnim.step >= boardTokenAnim.path.length) {
    boardTokenAnim = null; // animation done — token is now "settled"
    SFX.tokenArrive();
    // Phase-based landing sound cue
    if (G) {
      if (G.phase === 'resolve:battle') SFX.battleStart();
      else if (G.phase === 'resolve:claim') SFX.claimTile();
    }
    render();
    return;
  }
  SFX.tokenHop();
  render();
  setTimeout(advanceTokenAnim, 230);
}

// Used as fallback if boardTokenAnim wasn't pre-seeded (shouldn't happen in normal flow)
function startTokenAnim(playerIdx, fromPos, toPos) {
  const path = buildHopPath(fromPos, toPos);
  if (path.length <= 1) { render(); return; }
  boardTokenAnim = {playerIdx, path, step: 0};
  advanceTokenAnim(); // immediately steps to path[1] (fromPos+1)
}

// ─── Board die animation ─────────────────────────────────────────────────────────────────
function startBoardDieAnimation(finalVal, fromPos, toPos, animPlayerIdx) {
  boardShowIdleDie = true;
  render(); // renders board with idle die showing '?'

  const dieEl = document.getElementById('board-anim-die');
  const faceEl = document.getElementById('board-die-face');
  if (!dieEl || !faceEl) {
    boardShowIdleDie = false;
    boardRollAnimating = false;
    render();
    return;
  }

  const seq = [1,2,3,4,5,6,1,2,3,4,5,6];
  let step = 0;

  function boardCycle() {
    if (!faceEl.isConnected) return;
    if (step < seq.length) {
      SFX.dieTick();
      faceEl.textContent = seq[step++];
      faceEl.classList.remove('board-die-flash');
      void faceEl.offsetWidth;
      faceEl.classList.add('board-die-flash');
      dieEl.classList.remove('die-cycling');
      void dieEl.offsetWidth;
      dieEl.classList.add('die-cycling');
      setTimeout(boardCycle, 85);
    } else {
      dieEl.classList.remove('die-cycling');
      dieEl.classList.add('die-landed');
      SFX.dieLand(finalVal);
      faceEl.textContent = finalVal;
      faceEl.classList.remove('board-die-flash');
      void faceEl.offsetWidth;
      faceEl.classList.add('board-die-flash');
      setTimeout(() => {
        boardShowIdleDie = false;
        boardRollAnimating = false;
        if (boardPendingG) {
          boardPrevPhase = boardPendingG.phase;
          boardPrevCurrentPlayer = boardPendingG.currentPlayer;
          G = boardPendingG; boardPendingG = null;
        }
        // Continue token animation: boardTokenAnim was pre-seeded at fromPos,
        // now advance it hop-by-hop. Falls back to render() if nothing to animate.
        if (boardTokenAnim && boardTokenAnim.playerIdx === animPlayerIdx) {
          advanceTokenAnim(); // steps from path[0]=fromPos → path[1]...toPos
        } else if (fromPos != null && toPos != null && fromPos !== toPos && animPlayerIdx != null) {
          startTokenAnim(animPlayerIdx, fromPos, toPos); // fallback
        } else {
          render();
        }
      }, 2500);
    }
  }

  setTimeout(boardCycle, 50);
}

function doSpectatorJoin() {

    ws.send(JSON.stringify({ action: 'spectate_connect', roomCode: code }));

// ─── WebSocket connection ────────────────────────────────────────────────────────────────
function connect(){
  reconnectTimer = null; // clear so onclose guard knows no timer is pending
  const chip = document.getElementById('conn-chip');
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}`);

  ws.onopen = () => {
    clearTimeout(reconnectTimer);
    reconnectTimer = null;
    if (isSpectator) {
      chip.className = 'ok';
      chip.textContent = '● Spectating';
      if (!spectatorJoined) {
        renderSpectatorJoin();
      }
    } else {
      chip.className = 'ok';
      chip.textContent = '● Board View';
      // Claim or create a room — use persisted room code so reconnects land in the same room
      ws.send(JSON.stringify({ action: 'board_connect', roomCode: savedRoomCode }));
    }
  };

  ws.onmessage = e => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'ready') return; // server ready ping — board_connect was just sent
    if (msg.type === 'error' && isSpectator && !spectatorJoined) {
      renderSpectatorJoin(msg.message || 'Room not found');
      return;
    }
    if (msg.type === 'state') {
      if (isSpectator) spectatorJoined = true; // first state received = successfully joined
      // Save room code on first state so reconnects always land in the same room
      if (msg.game && msg.game.roomCode && !savedRoomCode) {
        savedRoomCode = msg.game.roomCode;
        history.replaceState(null, '', `?room=${savedRoomCode}`);
      }
      if (boardRollAnimating) {
        boardPendingG = msg.game;
        return;
      }
      const newG = msg.game;
      const prevPhase = boardPrevPhase;
      const prevPlayer = boardPrevCurrentPlayer;
      // Only trigger roll animation if the same player's turn is still active
      // (cross-turn: prevPlayer changes → not a roll completion for the new player)
      const rollJustHappened = prevPhase === 'roll'
        && newG.phase !== 'roll'
        && (prevPlayer === null || prevPlayer === newG.currentPlayer);
      const rollVal = newG.players[newG.currentPlayer]?.lastDiceRoll;
      // Capture previous positions BEFORE overwriting G (needed for token animation)
      const prevPositions = G ? G.players.map(p => p.position) : null;
      boardPrevPhase = newG.phase;
      boardPrevCurrentPlayer = newG.currentPlayer;
      G = newG;
      if (rollJustHappened && rollVal != null) {
        boardRollAnimating = true;
        boardPendingG = null;
        const animPlayerIdx = newG.currentPlayer;
        const fromPos = prevPositions ? prevPositions[animPlayerIdx] : null;
        const toPos = newG.players[animPlayerIdx]?.position;
        // Pre-seed boardTokenAnim at fromPos so the token STAYS at the old tile
        // while the die is spinning — prevents the "jump-to-destination" bug.
        if (fromPos != null && toPos != null && fromPos !== toPos) {
          boardTokenAnim = {playerIdx: animPlayerIdx, path: buildHopPath(fromPos, toPos), step: 0};
        }
        startBoardDieAnimation(rollVal, fromPos, toPos, animPlayerIdx);
      } else if (newG.phase === 'resolve:battle' && prevPhase !== 'resolve:battle') {
        // Battle arrived without going through roll animation (warp, reconnect, etc.)
        // Block render and show idle die for 2s so battle overlay isn't instant
        boardRollAnimating = true;
        boardPendingG = null;
        boardShowIdleDie = true;
        render();
        setTimeout(() => {
          boardShowIdleDie = false;
          boardRollAnimating = false;
          if (boardPendingG) {
            boardPrevPhase = boardPendingG.phase;
            boardPrevCurrentPlayer = boardPendingG.currentPlayer;
            G = boardPendingG; boardPendingG = null;
          }
          SFX.battleStart();
          render();
        }, 2000);
      } else {
        // Phase-transition sound cues
        if (newG.phase === 'resolve:battle_result' && prevPhase !== 'resolve:battle_result' && newG.lastBattle) {
          const oc = newG.lastBattle.outcome;
          if      (oc === 'attacker_wins') SFX.battleWin();
          else if (oc === 'defender_wins') SFX.battleLose();
          else if (oc === 'mutual')        SFX.battleMutual();
          else if (oc === 'stalemate')     SFX.battleStalemate();
        }
        render();
      }
    }
  };

  ws.onclose = ws.onerror = () => {
    if (reconnectTimer) return; // already scheduled — don't double-queue
    chip.className = 'err';
    chip.textContent = '✕ Disconnected';
    G = null;
    render();
    reconnectTimer = setTimeout(connect, 2000);
  };
}

// ─── 5-beat battle animation ────────────────────────────────────────────────────────────────
async function runBattleAnimation(lb, attPlayer, defPlayer, overlay) {
  const hasCounter = lb.outcome === 'defender_wins' || lb.outcome === 'stalemate';
  const attCrumbles = lb.outcome === 'defender_wins' || lb.outcome === 'mutual';
  const defCrumbles = lb.outcome === 'attacker_wins' || lb.outcome === 'mutual';
  const isStalemate = lb.outcome === 'stalemate';
  const outcomeLabel = {attacker_wins:'Victory!',defender_wins:'Defeated!',mutual:'Mutual Destruction!',stalemate:'Stalemate!'}[lb.outcome] || lb.outcome;
  const outcomeColor = {attacker_wins:'#5dc97d',defender_wins:'#e05252',mutual:'#e0b050',stalemate:'#9184d9'}[lb.outcome] || 'var(--accent-lit)';
  const effLabel = lb.attM && lb.defM ? (TYPE_STRONG[lb.attM.type]===lb.defM.type ? '2× Strong!' : TYPE_WEAK[lb.attM.type]===lb.defM.type ? '½× Weak' : '') : '';

  overlay.innerHTML = `
    <div style="font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--accent-pale);font-family:'Cinzel',serif;margin-bottom:18px;">⚔ Battle</div>
    <div id="baArena" style="display:flex;align-items:center;gap:36px;position:relative;">
      <div id="baAttSide" style="display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;">
        <div style="font-size:9px;letter-spacing:.14em;text-transform:uppercase;font-family:'Cinzel',serif;color:${attPlayer?.color||'var(--accent-lit)'};">${attPlayer?.name||'Attacker'}</div>
        <div id="baAttCard" style="display:inline-block;position:relative;">${renderBoardCard(lb.attM)}</div>
        <div id="baAttDmg" style="position:absolute;top:14px;left:50%;font-size:22px;font-weight:900;font-family:'Cinzel',serif;color:#e84040;pointer-events:none;text-shadow:0 0 12px #e8404088;white-space:nowrap;opacity:0;transform:translateX(-50%);">-${lb.defDmg}</div>
      </div>
      <div id="baMid" style="display:flex;flex-direction:column;align-items:center;gap:10px;min-width:54px;">
        ${effLabel ? `<div style="font-size:11px;color:var(--text-lo);font-family:'Cinzel',serif;letter-spacing:.06em;text-align:center;">${effLabel}</div>` : ''}
      </div>
      <div id="baDefSide" style="display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;">
        <div style="font-size:9px;letter-spacing:.14em;text-transform:uppercase;font-family:'Cinzel',serif;color:${defPlayer?.color||'var(--text-dim)'};">${defPlayer?.name||'Defender'}</div>
        <div id="baDefCard" style="display:inline-block;position:relative;">${renderBoardCard(lb.defM)}</div>
        <div id="baDefDmg" style="position:absolute;top:14px;left:50%;font-size:22px;font-weight:900;font-family:'Cinzel',serif;color:#e84040;pointer-events:none;text-shadow:0 0 12px #e8404088;white-space:nowrap;opacity:0;transform:translateX(-50%);">-${lb.atkDmg}</div>
      </div>
    </div>
    <div id="baOutcome" style="opacity:0;font-family:'Cinzel',serif;font-size:38px;font-weight:900;color:${outcomeColor};text-shadow:0 0 28px ${outcomeColor}66;letter-spacing:.05em;margin-top:22px;">${outcomeLabel}</div>
    <div style="font-size:9px;color:var(--text-mute);margin-top:10px;letter-spacing:.1em;">tap to skip</div>`;

  const attCard = overlay.querySelector('#baAttCard');
  const defCard = overlay.querySelector('#baDefCard');
  const attDmg  = overlay.querySelector('#baAttDmg');
  const defDmg  = overlay.querySelector('#baDefDmg');
  const outcomeEl = overlay.querySelector('#baOutcome');
  const attSide = overlay.querySelector('#baAttSide');
  const defSide = overlay.querySelector('#baDefSide');
  const arena   = overlay.querySelector('#baArena');

  let skipped = false;
  function showFinal() {
    skipped = true;
    if (attCrumbles) attCard.style.opacity = '0';
    if (defCrumbles) defCard.style.opacity = '0';
    if (isStalemate) {
      [attCard,defCard].forEach(c=>{ c.style.boxShadow='0 0 0 3px #c9922a88'; c.style.borderRadius='10px'; });
    }
    attDmg.style.opacity = '0';
    defDmg.style.opacity = '0';
    outcomeEl.style.opacity = '1';
  }
  overlay.addEventListener('click', showFinal);

  function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
  function shock(color) {
    const el = document.createElement('div');
    el.style.cssText = `position:absolute;top:50%;left:50%;width:110px;height:110px;border-radius:50%;border:5px solid ${color};pointer-events:none;`;
    arena.appendChild(el);
    el.animate([
      {transform:'translate(-50%,-50%) scale(.1)',opacity:.85,borderWidth:'6px'},
      {transform:'translate(-50%,-50%) scale(3.4)',opacity:0,borderWidth:'1px'}
    ],{duration:500,easing:'ease-out',fill:'forwards'}).finished.then(()=>el.remove());
  }
  function shake(el, dir=1) {
    el.animate([
      {transform:'translateX(0)'},
      {transform:`translateX(${-9*dir}px) rotate(${-2.5*dir}deg)`},
      {transform:`translateX(${7*dir}px) rotate(${1.5*dir}deg)`},
      {transform:`translateX(${-5*dir}px)`},
      {transform:`translateX(${3*dir}px)`},
      {transform:'translateX(0)'}
    ],{duration:430,easing:'ease'});
  }
  function floatDmg(el) {
    el.style.opacity = '1';
    el.animate([
      {opacity:0,transform:'translateX(-50%) translateY(0) scale(.6)'},
      {opacity:1,transform:'translateX(-50%) translateY(-10px) scale(1.2)',offset:.15},
      {opacity:1,transform:'translateX(-50%) translateY(-34px) scale(1)',offset:.72},
      {opacity:0,transform:'translateX(-50%) translateY(-48px) scale(.85)'}
    ],{duration:920,easing:'ease',fill:'forwards'}).finished.then(()=>{ el.style.opacity='0'; });
  }

  // Beat 1 — slide in
  attSide.animate([{transform:'translateX(-60px)',opacity:0},{transform:'translateX(0)',opacity:1}],{duration:340,easing:'ease',fill:'both'});
  defSide.animate([{transform:'translateX(60px)',opacity:0},{transform:'translateX(0)',opacity:1}],{duration:340,easing:'ease',fill:'both'});

  await wait(380); if (skipped) return;

  // Beat 2 — attacker strikes
  attCard.animate([
    {transform:'translateX(0) scale(1)'},
    {transform:'translateX(44px) scale(1.07)',offset:.38},
    {transform:'translateX(0) scale(1)'}
  ],{duration:330,easing:'ease'});
  shock('rgba(255,180,60,.75)');
  setTimeout(()=>{ if (!skipped){ shake(defCard,-1); floatDmg(defDmg); } },130);

  await wait(hasCounter ? 390 : 330); if (skipped) return;

  // Beat 3 — counter-strike (if defender survived)
  if (hasCounter) {
    defCard.animate([
      {transform:'translateX(0) scale(1)'},
      {transform:'translateX(-44px) scale(1.07)',offset:.38},
      {transform:'translateX(0) scale(1)'}
    ],{duration:330,easing:'ease'});
    shock('rgba(100,140,255,.75)');
    setTimeout(()=>{ if (!skipped){ shake(attCard,1); floatDmg(attDmg); } },130);
    await wait(390); if (skipped) return;
  }

  // Beat 4 — crumble or gold pulse
  const crumbleKf = [
    {transform:'scale(1) rotate(0deg)',opacity:1,filter:'saturate(1)'},
    {transform:'scale(1.04) rotate(-3deg)',opacity:1,filter:'saturate(.25)',offset:.22},
    {transform:'scale(.82) rotate(9deg) translateY(14px)',opacity:.55,filter:'saturate(0) brightness(.55)',offset:.62},
    {transform:'scale(.38) rotate(20deg) translateY(32px)',opacity:0,filter:'saturate(0) brightness(.2)'}
  ];
  if (isStalemate) {
    [attCard,defCard].forEach(c=>c.animate([
      {boxShadow:'0 0 0 0 rgba(201,146,42,0)',borderRadius:'10px'},
      {boxShadow:'0 0 0 9px rgba(201,146,42,.55)',borderRadius:'10px'},
      {boxShadow:'0 0 0 5px rgba(201,146,42,.22)',borderRadius:'10px'},
      {boxShadow:'0 0 0 7px rgba(201,146,42,.38)',borderRadius:'10px'},
      {boxShadow:'0 0 0 3px rgba(201,146,42,.18)',borderRadius:'10px'}
    ],{duration:620,easing:'ease',fill:'forwards'}));
  } else {
    if (attCrumbles) attCard.animate(crumbleKf,{duration:560,easing:'ease',fill:'forwards'});
    if (defCrumbles) defCard.animate(crumbleKf,{duration:560,easing:'ease',fill:'forwards'});
  }

  await wait(510); if (skipped) return;

  // Beat 5 — outcome text
  outcomeEl.style.opacity = '1';
  outcomeEl.animate([
    {opacity:0,transform:'scale(.48)'},
    {opacity:1,transform:'scale(1.14)',offset:.58},
    {opacity:1,transform:'scale(.95)',offset:.82},
    {opacity:1,transform:'scale(1)'}
  ],{duration:460,easing:'ease',fill:'both'});
}

// ─── Render entry ───────────────────────────────────────────────────────────────────────────
function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  updateDisconnectOverlay();
  if (!G) { renderConnecting(app); return; }
  if (G.phase === 'lobby') { renderLobby(app); return; }
  renderGame(app);
}

function updateDisconnectOverlay(){
  const ov = document.getElementById('disconnect-overlay');
  if (!ov) return;
  if (!G || !G.pausedFor) { ov.classList.remove('visible'); return; }
  const pf = G.pausedFor;
  ov.querySelector('.dco-title').innerHTML = `<span style="color:${pf.color}">${pf.name}</span> has left`;
  ov.querySelector('.dco-code').textContent = G.roomCode;
  ov.querySelector('.dco-wait span').textContent = `Waiting for ${pf.name} to rejoin…`;
  ov.classList.add('visible');
}

function renderConnecting(app){
  const d = document.createElement('div');

  backdrop.addEventListener('click', e => { if (e.target === backdrop) closeAboutModal(); });
  document.getElementById('about-modal-close-btn').addEventListener('click', closeAboutModal);
}

function closeAboutModal() {
  const el = document.getElementById('about-modal-backdrop');
  if (el) el.remove();
}

function renderLobby(app){
  const root = document.createElement('div');
  root.id = 'scale-root';
  scaleRoot(root);

  // Background image
  const bg = document.createElement('div');
  bg.style.cssText = `position:absolute;inset:0;background:url(${BKG_SRC}) center/cover no-repeat;z-index:0;`;
  root.appendChild(bg);

  // Dark overlay
  const ov = document.createElement('div');
  ov.style.cssText = 'position:absolute;inset:0;background:rgba(6,6,16,.76);z-index:1;';
  root.appendChild(ov);

  const splash = document.createElement('div');
  splash.className = 'lobby-splash';

  const playerCount = G.players.length;
  const canStart = playerCount >= 2;
  const code = G.roomCode || '????';
  const playerURL = `${location.protocol}//${location.host}/player`;
  const SET_NAMES = {A:'The Cabal',B:'The Warpack',C:'The Order',D:'The Arcane Watch',E:'Divine Guard',F:'Chaos Legion'};

  // ── Brand
